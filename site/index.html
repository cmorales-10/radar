<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar</title>
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #14181d; --muted: #5d6773; --line: #e1e4e8;
  --accent: #0b6bcb; --up: #0a7d4f; --down: #c4322b; --warn-bg: #fdf3dc; --warn: #7a5300;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101418; --card: #1a2027; --text: #edf0f3; --muted: #9aa5b1; --line: #2b333c;
    --accent: #6cb2f7; --up: #4cc38a; --down: #f2756d; --warn-bg: #3a2e12; --warn: #f0c870;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom));
}
main { max-width: 640px; margin: 0 auto; padding: 12px 16px; }
header { max-width: 640px; margin: 0 auto; padding: 14px 16px 2px; }
h1 { margin: 0; font-size: 22px; }
h2 { font-size: 17px; margin: 18px 0 8px; }
.status { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--muted); }
.dot.open { background: var(--up); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.sym { font-weight: 700; font-size: 18px; }
.name { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.up { color: var(--up); } .down { color: var(--down); }
.score { font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 5px; border-radius: 3px; background: var(--line); margin: 8px 0; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.flag { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-top: 8px; }
details { margin-top: 8px; font-size: 14px; }
summary { color: var(--accent); cursor: pointer; padding: 4px 0; }
a { color: var(--accent); }
.links { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 14px; }
.muted { color: var(--muted); font-size: 13px; }
.brief { white-space: pre-wrap; font-size: 14px; }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
nav {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
  display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1; max-width: 160px; min-height: 52px; background: none; border: 0; color: var(--muted);
  font: inherit; font-size: 14px; cursor: pointer;
}
nav button[aria-selected="true"] { color: var(--accent); font-weight: 600; }
.target { outline: 2px solid var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Radar</h1>
  <div class="status"><span id="market"></span><span id="updated"></span></div>
</header>
<main id="view"><p class="muted">Loading...</p></main>
<nav role="tablist">
  <button data-tab="radar" role="tab">Radar</button>
  <button data-tab="alerts" role="tab">Alerts</button>
  <button data-tab="score" role="tab">Scorecard</button>
  <button data-tab="about" role="tab">About</button>
</nav>
<script src="app.js"></script>
</body>
</html>
